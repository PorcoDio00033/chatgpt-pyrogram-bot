name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 test image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: test-image-amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Run Trivy vulnerability scanner (amd64)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-image-amd64
          format: 'sarif'
          output: 'trivy-results-amd64.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results (amd64)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-amd64.sarif'
          category: 'amd64'

      - name: Test amd64 container
        run: |
          # Run container and wait for exit
          docker run --name test-container -e WORKFLOW=true -e TELEGRAM_API_ID=69 test-image-amd64
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Container failed with exit code $EXIT_CODE"
            docker logs test-container
            exit 1
          fi
          
          # Check logs for expected output
          if ! docker logs test-container 2>&1 | grep -q "Workflow mode detected"; then
            echo "❌ Expected workflow mode message not found!"
            docker logs test-container
            exit 1
          fi
          
          if docker logs test-container 2>&1 | grep -iE "error|exception|fatal" | grep -v "expected_error"; then
            echo "❌ Unexpected errors found in logs!"
            docker logs test-container
            exit 1
          fi
          
          echo "✅ amd64 tests passed"

      - name: Cleanup
        if: always()
        run: docker rm -f test-container || true

  test-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 test image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          platforms: linux/arm64
          tags: test-image-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64

      - name: Run Trivy vulnerability scanner (arm64)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-image-arm64
          format: 'sarif'
          output: 'trivy-results-arm64.sarif'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results (arm64)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-arm64.sarif'
          category: 'arm64'

      - name: Test arm64 container
        run: |
          # Run container and wait for exit
          docker run --name test-container -e WORKFLOW=true -e TELEGRAM_API_ID=69 test-image-arm64
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Container failed with exit code $EXIT_CODE"
            docker logs test-container
            exit 1
          fi
          
          # Check logs for expected output
          if ! docker logs test-container 2>&1 | grep -q "Workflow mode detected"; then
            echo "❌ Expected workflow mode message not found!"
            docker logs test-container
            exit 1
          fi
          
          if docker logs test-container 2>&1 | grep -iE "error|exception|fatal" | grep -v "expected_error"; then
            echo "❌ Unexpected errors found in logs!"
            docker logs test-container
            exit 1
          fi
          
          echo "✅ arm64 tests passed"

      - name: Cleanup
        if: always()
        run: docker rm -f test-container || true

  build-and-push:
    needs: [test-amd64, test-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit date
        id: date
        run: echo "date=$(git show -s --format=%cd --date=format:%Y%m%d-%H%M%S ${{ github.sha }})" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/dev' }}
            type=pep440,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
            type=raw,value=${{ steps.date.outputs.date }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64